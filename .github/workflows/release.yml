name: release

# A tag vX.Y.Z publishes that version to PyPI and makes a GitHub Release from its CHANGELOG.md section.
# PyPI trusts this file by name (release.yml) and the environment pypi: renaming either stops publishing
# until the trusted publisher on PyPI is changed to match. The publish job waits for approval in pypi.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: the tag, pyproject.toml, __version__ and CHANGELOG.md name the same version
        run: python3 scripts/release.py check "$GITHUB_REF_NAME"

  test:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false  # nothing cached from other runs reaches a release
      - run: uv sync --locked --python 3.14
      - run: uv run --locked pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - run: uv build --no-sources
      - run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: the wheel holds only the tgsweep package and its metadata
        run: python3 scripts/release.py wheel dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tgsweep/
    permissions:
      id-token: write  # trusted publishing: PyPI checks the run's OIDC token, there is no password
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - name: GitHub Release with the files published to PyPI
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "tgsweep ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
