# Weekly update pull requests; CI runs the tests on each one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Raise the lower bound in pyproject.toml to the new release, not only uv.lock: uv tool install
    # resolves pyproject.toml, so that is what users get.
    versioning-strategy: increase
    # A new release waits a week before it is proposed: a broken or hijacked one is usually pulled by then.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The actions are pinned by commit SHA with the version in a comment; Dependabot updates both.
    cooldown:
      default-days: 7
